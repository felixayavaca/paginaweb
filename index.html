    .card h2 { font-size: 1.2rem; margin: 12px 0 8px; }
    .card p { font-size: 0.9rem; color: #bbb; margin-bottom: 15px; }
    .btn { display: inline-block; padding: 8px 16px; background: #00bcd4; color: #000; text-decoration: none; font-weight: bold; border-radius: 5px; }
    .btn:hover { background: #008c9e; color: #fff; }
  </style>
</head>
